<div class="members-panel">
  <div class="panel-header">
    <h3>Members</h3>
    <button class="close-btn" (click)="closed.emit()" aria-label="Close members panel">&times;</button>
  </div>

  <button class="invite-btn" (click)="onInvite()">Invite</button>

  @if (loading$ | async) {
    <div class="loading-skeleton" aria-busy="true">
      @for (i of [1, 2, 3]; track i) {
        <div class="skeleton-item" aria-hidden="true">
          <div class="skeleton-avatar"></div>
          <div class="skeleton-text"></div>
        </div>
      }
    </div>
  } @else {
    <div class="member-list" role="list">
      @for (member of members$ | async; track member.userId) {
        <div class="member-item" role="listitem">
          <app-avatar [displayName]="member.displayName" [userId]="member.userId" [size]="36"></app-avatar>
          <div class="member-info">
            <span class="member-name">{{ member.displayName }}</span>
            <span class="member-joined">Joined {{ member.joinedAt | relativeTime }}</span>
          </div>
        </div>
      }
    </div>
  }

  <div class="panel-footer">
    <button
      class="leave-btn"
      (click)="onLeaveGroup()"
      [disabled]="(leaving$ | async)"
    >
      @if (leaving$ | async) {
        Leaving...
      } @else {
        Leave group
      }
    </button>
  </div>
</div>
