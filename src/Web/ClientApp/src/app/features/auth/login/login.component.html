<div class="login-container">
  <div class="login-card">
    <h1>Sign in to your account</h1>

    @if (serverError) {
      <div class="server-error" role="alert">
        {{ serverError }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="e.g. jane@example.com"
          [attr.aria-describedby]="email.touched && email.errors ? 'email-error' : null"
          [class.error]="email.touched && email.errors"
        />
        @if (email.touched && email.errors) {
          <span id="email-error" class="field-error" role="alert">
            {{ getErrorMessage('email') }}
          </span>
        }
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="At least 8 characters"
          [attr.aria-describedby]="password.touched && password.errors ? 'password-error' : null"
          [class.error]="password.touched && password.errors"
        />
        @if (password.touched && password.errors) {
          <span id="password-error" class="field-error" role="alert">
            {{ getErrorMessage('password') }}
          </span>
        }
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="form.invalid || isSubmitting"
      >
        @if (isSubmitting) {
          <span class="spinner"></span>
          Signing in...
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="auth-link">
      Don't have an account? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
