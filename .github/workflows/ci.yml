name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── .NET setup ──
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── Backend build (warnings-as-errors via .editorconfig) ──
      - name: Backend build
        run: dotnet build SimpleChat.slnx --configuration Release --no-incremental

      # ── Backend unit tests ──
      - name: Backend unit tests
        run: >
          dotnet test SimpleChat.slnx
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~UnitTests"
          --logger "trx;LogFileName=unit-results.trx"

      # ── Node setup + Frontend ──
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src/Web/ClientApp/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Frontend install
        run: npm ci
        working-directory: src/Web/ClientApp

      - name: Frontend lint
        run: npx ng lint
        working-directory: src/Web/ClientApp

      - name: Frontend unit tests
        run: npm test -- --ci --coverage
        working-directory: src/Web/ClientApp

      # ── Integration tests (Testcontainers — Docker available on ubuntu-latest) ──
      - name: Integration tests
        run: >
          dotnet test SimpleChat.slnx
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~IntegrationTests"
          --logger "trx;LogFileName=integration-results.trx"

      # ── Upload test artifacts ──
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            src/Web/ClientApp/coverage/
          retention-days: 7

  docker:
    name: Docker Build
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR builds — build only, no push
      - name: Docker build (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: simplechat:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Main branch — build and push to ghcr.io
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
